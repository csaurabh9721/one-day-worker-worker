spring:

  datasource:
    url: jdbc:mysql://localhost:3306/worker_service
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  # Disable OpenFeign CircuitBreaker integration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

# ==========================
# Server
# ==========================
server:
  port: ${SERVER_PORT:8082}
# ==========================
# Eureka
# ==========================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: false
    hostname: localhost


# ==========================
# Resilience4j
# ==========================
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        recordExceptions:
          - feign.FeignException
          - feign.RetryableException
    instances:
      Rating-Service:
        baseConfig: default
      User-Service:
        baseConfig: default

