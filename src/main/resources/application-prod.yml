spring:

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/worker_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


# ==========================
# Server
# ==========================
server:
  port: ${SERVER_PORT:8082}


# ==========================
# Eureka
# ==========================
eureka:
  client:
    enabled: true

    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}

    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true


# ==========================
# Resilience4j
# ==========================
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        recordExceptions:
          - feign.FeignException
          - feign.RetryableException
    instances:
      Rating-Service:
        baseConfig: default
      User-Service:
        baseConfig: default

